$kind: http-request
url: "{{baseUrl}}/rooms"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer_{{token}}
body:
  type: text
  content: |-
    {
        "id": {{roomId}},
        "name": "{{roomUpdatedTitle}}",
        "disable": false,
        "type": {"id": {{roomTypeId}}}
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('roomId')) {
          console.warn('roomId is not set, skipping.');
          pm.execution.skipRequest();
      }
      const timestamp = Date.now();
      pm.environment.set("roomUpdatedTitle", "Updated_Room_" + timestamp);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Response contains updated resource", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property('id');
          const expectedId = parseInt(pm.environment.get("roomId"));
          pm.expect(json.id).to.eql(expectedId);
      });

      pm.test("Room name was updated", () => {
          const json = pm.response.json();
          pm.expect(json.name).to.eql(pm.environment.get("roomUpdatedTitle"));
      });

      pm.test("Response time is less than 1000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
    language: text/javascript
order: 4000
